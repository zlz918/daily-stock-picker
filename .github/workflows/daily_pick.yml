name: Daily Stock Picker

on:
  schedule:
    # 北京时间 17:00 运行 (17 - 8 = 09 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip' # 自动处理依赖缓存，加速运行

    - name: Install Dependencies
      run: |
        pip install pandas numpy tushare yfinance lxml

    - name: Run Stock Picker
      env:
        # 必须在仓库 Settings -> Secrets 中设置此变量
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        # 如果有微信推送的 Key，也可以存在这里
        # PUSH_KEY: ${{ secrets.PUSH_KEY }}
      run: python stock_picker.py

    - name: Commit Results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.csv
        git commit -m "Auto Update: $(date +'%Y-%m-%d') Stock Picks" || exit 0
        git push
