name: 每日选股

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 北京时间 15:30 触发
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 解决 Node.js 20 警告

jobs:
  run-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5             # ← 升级到 v5，解决 Node.js 警告

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install akshare yfinance pandas numpy

      - name: 检查依赖版本（调试用）
        run: |
          python -c "import akshare as ak; print('akshare:', ak.__version__)"
          python -c "import yfinance as yf; print('yfinance:', yf.__version__)"
          python -c "import pandas as pd;   print('pandas:',  pd.__version__)"

      - name: 运行选股 + 微信推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python stock_picker.py

      - name: 提交结果
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add picks_*.csv detail_*.csv || true
          git diff --staged --quiet || git commit -m "📈 $(date '+%Y-%m-%d') 选股结果"
          git push
