name: Daily Stock Picker

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # 已升级

    - name: Set up Python
      uses: actions/setup-python@v5 # 已升级
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install pandas numpy tushare yfinance lxml

    - name: Run Stock Picker
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      run: python stock_picker.py

    - name: Commit Results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.csv
        git commit -m "Auto Update: $(date +'%Y-%m-%d') Stock Picks" || exit 0
        git push
